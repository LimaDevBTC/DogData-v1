[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dogdata"
version = "1.0.0"
description = "Python SDK for DOG DATA API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["dogdata", "bitcoin", "runes", "dog-go-to-the-moon", "api"]
dependencies = [
  "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://www.dogdata.xyz"
Documentation = "https://www.dogdata.xyz/docs"
Repository = "https://github.com/dogdata/sdk-python"
